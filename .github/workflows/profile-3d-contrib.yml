name: 3D contribution graph

on:
  schedule:
    - cron: "17 3 * * *" # every night
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/profile-3d-contrib.json
      - .github/workflows/profile-3d-contrib.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: tools/profile-3d-contrib.json

      - name: Commit the new graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if git commit -m "chore: update 3D contribution graph"; then
            git push
          fi
